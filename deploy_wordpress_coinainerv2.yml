---
# =======================================================
# FASE 1: WordPress LXC-containers aanmaken
# =======================================================

- name: WordPress-containers uitrollen op Proxmox
  hosts: proxmox
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    wordpress_containers:
      - vmid: 120
        name: wp-site-1
        ip: 10.24.20.120

      - vmid: 121
        name: wp-site-2
        ip: 10.24.20.121

      - vmid: 122
        name: wp-site-3
        ip: 10.24.20.122

      - vmid: 123
        name: wp-site-4
        ip: 10.24.20.123

  tasks:
    - name: Maak de LXC-containers aan
      community.proxmox.proxmox:
        api_host: "{{ ansible_host }}"
        validate_certs: false
        api_user: "root@pam"
        api_token_id: "{{ vault_proxmox_token_id }}"
        api_token_secret: "{{ vault_proxmox_token_secret }}"
        node: "S1"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        ostemplate: "local:vztmpl/debian-12-turnkey-wordpress_18.2-1_amd64.tar.gz"
        cores: 2
        memory: 2048
        disk: "Vmpool:16"
        password: "Wordpress!123"
        unprivileged: true
        features:
          - nesting=1
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ item.ip }}/24,gw=10.24.20.1,firewall=1"
        pubkey: "{{ lookup('file', '/root/.ssh/Ansible_VM.pub') }}"
        state: present
      loop: "{{ wordpress_containers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Start de containers
      community.proxmox.proxmox:
        api_host: "{{ ansible_host }}"
        validate_certs: false
        api_user: "root@pam"
        api_token_id: "{{ vault_proxmox_token_id }}"
        api_token_secret: "{{ vault_proxmox_token_secret }}"
        node: "S1"
        vmid: "{{ item.vmid }}"
        state: started
        timeout: 300
      loop: "{{ wordpress_containers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Verwijder oude SSH-hostkeys
      ansible.builtin.command:
        cmd: "ssh-keygen -f /root/.ssh/known_hosts -R {{ item.ip }}"
      loop: "{{ wordpress_containers }}"
      loop_control:
        label: "{{ item.ip }}"
      delegate_to: localhost
      become: true
      changed_when: false
      failed_when: false

    - name: Wacht totdat SSH actief is
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        state: started
        timeout: 180
      loop: "{{ wordpress_containers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Voeg nieuwe SSH-hostkeys toe
      ansible.builtin.known_hosts:
        name: "{{ item.ip }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 10 -H -t ed25519 ' ~ item.ip) }}"
        path: "/root/.ssh/known_hosts"
        state: present
      loop: "{{ wordpress_containers }}"
      loop_control:
        label: "{{ item.ip }}"
      delegate_to: localhost
      become: true

    - name: Werk de inventory bij
      ansible.builtin.blockinfile:
        path: "{{ playbook_dir }}/inventory.ini"
        create: true
        insertafter: '^\[wordpress_containers\]$'
        marker: "# {mark} ANSIBLE WORDPRESS CONTAINERS"
        block: |
          {% for container in wordpress_containers %}
          {{ container.name }} ansible_host={{ container.ip }} ansible_user=root ansible_ssh_private_key_file=/root/.ssh/Ansible_VM proxmox_vmid={{ container.vmid }}
          {% endfor %}
      delegate_to: localhost
      become: false
      run_once: true